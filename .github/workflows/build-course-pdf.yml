name: Build Course PDF

on:
  push:
    branches: [main]
    paths:
      - 'course/1.Introduction.md'
      - 'course/2.StartingUp.md'
      - 'course/3.WorkingWithGit.md'
      - 'course/4.Conclusion.md'
      - 'CheatSheets/GitBashCheatSheet.md'
      - 'CheatSheets/MarkdownCheatSheet.md'
      - 'src/**'
      - '.github/workflows/build-course-pdf.yml'
      - 'src/settings.lua'
      - 'presentation/GitCrashCourse.tex'
  pull_request:
    paths:
      - 'course/1.Introduction.md'
      - 'course/2.StartingUp.md'
      - 'course/3.WorkingWithGit.md'
      - 'course/4.Conclusion.md'
      - 'CheatSheets/GitBashCheatSheet.md'
      - 'CheatSheets/MarkdownCheatSheet.md'
      - 'src/**'
      - '.github/workflows/build-course-pdf.yml'
      - 'src/settings.lua'
      - 'presentation/GitCrashCourse.tex'

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            latexmk

      - name: Build PDF
        run: |
          # Inject an Appendix heading before the cheat sheets
          printf '\n\\appendix\n\n# Appendix\n\n' > /tmp/appendix_header.md

          # Shift cheat sheet headings down one level (# → ##, ## → ###, etc.)
          # so they appear as subsections of the Appendix chapter in the PDF
          sed 's/^#/##/' CheatSheets/GitBashCheatSheet.md  > /tmp/GitBashCheatSheet.md
          sed 's/^#/##/' CheatSheets/MarkdownCheatSheet.md > /tmp/MarkdownCheatSheet.md

          pandoc \
            --from markdown+raw_tex \
            --pdf-engine=xelatex \
            --lua-filter=src/settings.lua \
            --number-sections \
            -V title="Git Introduction Course" \
            -V author="Romain De Groote" \
            -V date="\today" \
            -V geometry="margin=2.5cm" \
            -V mainfont="Latin Modern Roman" \
            course/1.Introduction.md \
            course/2.StartingUp.md \
            course/3.WorkingWithGit.md \
            course/4.Conclusion.md \
            /tmp/appendix_header.md \
            /tmp/GitBashCheatSheet.md \
            /tmp/MarkdownCheatSheet.md \
            -o course/GitCourse.pdf

      - name: Build clean presentation PDF
        run: |
          # Write the patched file into presentation/ so that relative image
          # paths (./../src/...) resolve correctly during compilation.
          sed 's/\\documentclass\[.*\]{beamer}/\\documentclass[handout]{beamer}/' \
            presentation/GitCrashCourse.tex > presentation/GitCrashCourse_handout.tex

          # -cd: latexmk changes to the input file's directory before compiling
          # Use absolute $PWD path for -output-directory so it is not affected by -cd
          latexmk -xelatex -cd -interaction=nonstopmode \
            -jobname=GitCrashCourse_handout \
            -output-directory="$PWD/presentation" \
            presentation/GitCrashCourse_handout.tex

          # Clean auxiliary files, keep only the PDF
          latexmk -c -jobname=GitCrashCourse_handout -output-directory="$PWD/presentation"

          # Remove the temporary patched source file
          rm presentation/GitCrashCourse_handout.tex

      - name: Upload course PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitCourse.pdf
          path: course/GitCourse.pdf

      - name: Upload presentation PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitCrashCourse_handout.pdf
          path: presentation/GitCrashCourse_handout.pdf

      # Optionally commit the generated PDF back to the repo
      - name: Commit PDF to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add course/GitCourse.pdf presentation/GitCrashCourse_handout.pdf
          git diff --cached --quiet || git commit -m "docs: regenerate PDFs [skip ci]"
          git push
